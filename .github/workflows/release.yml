# 构建发行版:构建 web 界面 → 打包单文件应用 → 生成更新日志 → 创建 Release
name: 发行版

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 手动触发仅构建并上传产物,不创建 Release

permissions:
  contents: write  # 必须有写权限才能创建 release

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-cliff 生成更新日志需要完整历史

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装 web 依赖
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: 构建 web 界面
        working-directory: web
        run: pnpm run build

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: CLI 冒烟测试
        run: |
          python tests/make_sample_mods.py
          python main.py "tests/sample/1.20.1-示例整合包" --json --no-export > /dev/null

      - name: 打包单文件应用
        run: python main.py --pack -o main.pyz

      - name: 打包产物冒烟测试
        run: python main.pyz "tests/sample/1.20.1-示例整合包/mods" --no-export > /dev/null

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: main.pyz
          path: main.pyz

      - name: 创建更新日志
        if: startsWith(github.ref, 'refs/tags/')
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --config-url https://raw.githubusercontent.com/NiButCrazy/nbc-auto-changelog/master/cliff.toml
        env:
          OUTPUT: CHANGELOG_NEW.md
          GITHUB_REPO: ${{ github.repository }}

      - name: 创建 Release 并附加产物
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG_NEW.md
          files: main.pyz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
